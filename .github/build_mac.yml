name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    permissions:
      contents: read
      packages: read
      actions: read
      
    steps:
      # Consistent v4 for all GitHub actions
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install py2app PyQt5 torch clip tqdm
          pip install --pre torch --extra-index-url https://download.pytorch.org/whl/nightly/cpu

      - name: Build with py2app
        run: |
          python setup.py py2app

      # Using v4 consistently
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac
          path: dist/MoodForager.app
          retention-days: 5
