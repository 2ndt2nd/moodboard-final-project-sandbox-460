name: Universal macOS Build (Intel + Apple Silicon)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          rm -rf build dist __pycache__ *.spec
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete
          find . -name '*.pyo' -delete

      - name: Install Intel-compatible gettext
        run: |
          # Uninstall any existing arm64 gettext
          brew uninstall --ignore-dependencies gettext || true
          
          # Install x86_64 version explicitly
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/usr/local/bin" >> $GITHUB_PATH
          arch -x86_64 /usr/local/bin/brew install gettext
          sudo mkdir -p /usr/local/opt/gettext/lib
          sudo ln -sf /usr/local/Cellar/gettext/*/lib/libintl.8.dylib /usr/local/opt/gettext/lib/

      - name: Setup Python (x86_64)
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          architecture: "x64"
          cache: 'pip'

      - name: Install universal dependencies
        run: |
          # Install Qt with x86_64 compatibility
          arch -x86_64 /usr/local/bin/brew install qt@5
          echo "QT_DIR=/usr/local/opt/qt@5" >> $GITHUB_ENV
          echo "/usr/local/opt/qt@5/bin" >> $GITHUB_PATH

          # Install Python packages
          python -m pip install --upgrade pip
          pip install \
            PyQt5==5.15.9 \
            PyQt5-sip==12.12.1 \
            --platform macosx_10_15_universal2 \
            --only-binary=:all:

          pip install \
            torch==2.0.1 \
            torchvision==0.15.2 \
            torchaudio==2.0.2 \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --platform macosx_11_0_universal2

          pip install \
            git+https://github.com/openai/CLIP.git \
            tqdm==4.65.0 \
            pillow==9.5.0 \
            pyinstaller==5.13.0

      - name: Build universal app
        run: |
          # Set universal build flags
          export MACOSX_DEPLOYMENT_TARGET=10.15
          export ARCHFLAGS="-arch x86_64 -arch arm64"
          export PYTHONARCHS="x86_64 arm64"

          # Generate spec file
          pyi-makespec --name MoodForager \
            --add-data="$(python -c 'import clip; print(clip.__path__[0])'):clip" \
            --add-data="$(python -c 'import torch; print(torch.__path__[0])'):torch" \
            --add-data="$(python -c 'import PIL; print(PIL.__path__[0])'):PIL" \
            --hidden-import=clip \
            --hidden-import=torch \
            --hidden-import=PIL \
            --windowed \
            --onedir \
            main_mf.py

          # Build with universal support
          pyinstaller MoodForager.spec --noconfirm --clean

          # Handle Qt plugins
          mkdir -p dist/MoodForager.app/Contents/Resources/qt_plugins
          cp -R $QT_DIR/plugins/* dist/MoodForager.app/Contents/Resources/qt_plugins/

          cat > dist/MoodForager.app/Contents/Resources/qt.conf <<EOF
          [Paths]
          Plugins = qt_plugins
          EOF

      - name: Verify universal binary
        run: |
          lipo -archs dist/MoodForager.app/Contents/MacOS/MoodForager | grep "x86_64 arm64" || exit 1
          otool -l dist/MoodForager.app/Contents/MacOS/MoodForager | grep -A3 LC_VERSION_MIN_MACOSX

      - name: Package and upload
        run: |
          cd dist
          ditto -c -k --keepParent MoodForager.app MoodForager-Mac-Universal.zip
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac-Universal
          path: dist/MoodForager-Mac-Universal.zip
          retention-days: 7