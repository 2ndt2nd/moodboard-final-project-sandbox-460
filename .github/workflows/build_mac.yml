name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Clean workspace
        run: |
          rm -rf build dist
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          brew install qt@5
          echo "QT_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV

      - name: Install Python dependencies with PEP 517
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install --use-pep517 py2app==0.28.6
          pip install --use-pep517 PyQt5==5.15.7 PyQt5-Qt5==5.15.2 PyQt5-sip==12.11.0
          pip install --use-pep517 torch==2.1.0 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --use-pep517 git+https://github.com/openai/CLIP.git
          pip install --use-pep517 tqdm==4.66.1 pillow==10.0.1

      - name: Build with modern py2app
        run: |
          # Create isolated build environment
          export PYTHONPATH=$(python -c "import sys; print(':'.join(sys.path))")
          python -m py2app.build_app setup.py --no-strip --use-pep517
          
          # Fix Qt paths
          find dist -name "Qt*" -exec install_name_tool -add_rpath @executable_path/../Frameworks {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac
          path: dist/MoodForager.app
          retention-days: 5
