name: Universal macOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          rm -rf build dist __pycache__ *.pyapp
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete
          find . -name '*.pyo' -delete

      - name: Install Python via Miniforge (explicit x86_64 version)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Mambaforge
          miniforge-version: 23.3.1-0
          miniforge-arch: x86_64
          installer-url: https://github.com/conda-forge/miniforge/releases/download/23.3.1-0/Mambaforge-23.3.1-0-MacOSX-x86_64.sh
          python-version: "3.10"
          activate-environment: "build"
          environment-file: environment.yml

      - name: Create conda environment file
        run: |
          cat > environment.yml <<EOF
          name: build
          channels:
            - conda-forge
            - defaults
          dependencies:
            - python=3.10
            - pip
            - gettext
            - qt
            - pyqt
            - pip:
              - torch==2.0.1
              - torchvision==0.15.2
              - torchaudio==2.0.2
              - git+https://github.com/openai/CLIP.git
              - tqdm==4.65.0
              - pillow==9.5.0
              - py2app==0.28.6
          EOF

      - name: Install dependencies via conda
        shell: bash -l {0}
        run: |
          conda env update -f environment.yml
          conda list

      - name: Create setup.py for py2app
        shell: bash -l {0}
        run: |
          cat > setup.py <<EOF
          from setuptools import setup
          import clip
          import torch
          import PIL
          
          APP = ['main_mf.py']
          DATA_FILES = [
              (clip.__path__[0], [f for f in clip.__path__[0].iterdir() if f.is_file()]),
              (torch.__path__[0], [f for f in torch.__path__[0].iterdir() if f.is_file()]),
              (PIL.__path__[0], [f for f in PIL.__path__[0].iterdir() if f.is_file()]),
          ]
          OPTIONS = {
              'argv_emulation': True,
              'arch': 'x86_64,arm64',
              'plist': {
                  'CFBundleName': 'MoodForager',
                  'CFBundleDisplayName': 'MoodForager',
                  'CFBundleVersion': '1.0',
                  'CFBundleShortVersionString': '1.0',
                  'NSHumanReadableCopyright': 'Copyright © 2023 Your Name',
                  'LSMinimumSystemVersion': '10.15.0',
              },
              'packages': ['clip', 'torch', 'PIL', 'PyQt5'],
              'iconfile': 'icon.icns',
              'qt_plugins': ['platforms', 'styles'],
          }
          
          setup(
              app=APP,
              data_files=DATA_FILES,
              options={'py2app': OPTIONS},
              setup_requires=['py2app'],
          )
          EOF

      - name: Build universal app with py2app
        shell: bash -l {0}
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.15
          python setup.py py2app --dist-dir dist
          
          # Copy Qt plugins
          mkdir -p dist/MoodForager.app/Contents/Resources/qt_plugins
          cp -R $CONDA_PREFIX/plugins/* dist/MoodForager.app/Contents/Resources/qt_plugins/

          # Create qt.conf
          cat > dist/MoodForager.app/Contents/Resources/qt.conf <<EOF
          [Paths]
          Plugins = qt_plugins
          EOF

      - name: Verify universal binary
        run: |
          lipo -archs dist/MoodForager.app/Contents/MacOS/MoodForager
          otool -l dist/MoodForager.app/Contents/MacOS/MoodForager | grep -A3 LC_VERSION_MIN_MACOSX

      - name: Package and upload
        run: |
          cd dist
          ditto -c -k --keepParent MoodForager.app MoodForager-Mac-Universal.zip
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac-Universal
          path: dist/MoodForager-Mac-Universal.zip
          retention-days: 7
