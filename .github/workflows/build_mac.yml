name: Build macOS Universal App (PyInstaller onedir)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          rm -rf build dist __pycache__ *.spec
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete
          find . -name '*.pyo' -delete

      - name: Install missing gettext (for Intel Python)
        run: brew install gettext

      - name: Set up Python 3.10 (Universal)
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          architecture: "x64"  # Needed to ensure compatibility with Intel

      - name: Install Qt
        run: |
          brew install qt@5
          echo "QT_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@5)/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 PyQt5-sip --prefer-binary --no-cache-dir
          pip install --pre torch torchvision torchaudio \
            --extra-index-url https://download.pytorch.org/whl/nightly/cpu \
            --no-cache-dir
          pip install git+https://github.com/openai/CLIP.git --no-cache-dir
          pip install tqdm pillow pyinstaller --no-cache-dir

      - name: Build with PyInstaller (Universal onedir)
        run: |
          # Generate spec with universal2 target
          pyi-makespec --name MoodForager \
            --target-arch universal2 \
            --add-data="$(python -c 'import clip; print(clip.__path__[0])'):clip" \
            --add-data="$(python -c 'import torch; print(torch.__path__[0])'):torch" \
            --add-data="$(python -c 'import PIL; print(PIL.__path__[0])'):PIL" \
            --hidden-import=clip \
            --hidden-import=torch \
            --hidden-import=PIL \
            --windowed \
            --onedir \
            main_mf.py

          # Build the app
          pyinstaller MoodForager.spec --noconfirm --clean --target-arch universal2

          # Fix Qt plugins path
          mkdir -p dist/MoodForager.app/Contents/Resources/qt_plugins
          cp -R "$QT_DIR/plugins/"* dist/MoodForager.app/Contents/Resources/qt_plugins/

          # Add qt.conf
          cat > dist/MoodForager.app/Contents/Resources/qt.conf <<EOF
          [Paths]
          Plugins = qt_plugins
          EOF

          # Check binary arch
          echo "Binary architectures:"
          lipo -archs dist/MoodForager.app/Contents/MacOS/MoodForager

          # Fail if not universal
          ARCHS=$(lipo -archs dist/MoodForager.app/Contents/MacOS/MoodForager)
          [[ "$ARCHS" == *"x86_64"* && "$ARCHS" == *"arm64"* ]] || {
            echo "❌ App is not a universal binary (x86_64 + arm64)"
            exit 1
          }

      - name: Package artifact
        run: |
          cd dist
          ditto -c -k --keepParent MoodForager.app MoodForager-Mac-Universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac-Universal
          path: dist/MoodForager-Mac-Universal.zip
          retention-days: 7
