name: Build Universal macOS App (PyInstaller)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          rm -rf build dist __pycache__ *.spec
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete
          find . -name '*.pyo' -delete

      - name: Set up Python 3.10 (Universal)
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'
          architecture: 'x64'  # GitHub's Python is already universal

      - name: Install Universal Qt
        run: |
          brew install qt@5
          echo "QT_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "/opt/homebrew/opt/qt@5/bin" >> $GITHUB_PATH
          # Verify Qt is universal
          file $(brew --prefix qt@5)/lib/*.dylib | grep -q 'universal binary' || echo "Warning: Qt not universal"

      - name: Install dependencies (Universal)
        run: |
          python -m pip install --upgrade pip
          # Force universal wheels
          pip install PyQt5 PyQt5-sip --prefer-binary --no-cache-dir
          pip install --pre torch torchvision torchaudio \
            --extra-index-url https://download.pytorch.org/whl/nightly/cpu \
            --no-cache-dir
          pip install git+https://github.com/openai/CLIP.git \
            --no-cache-dir
          pip install tqdm pillow pyinstaller \
            --no-cache-dir

      - name: Build Universal Binary
        run: |
          # Generate spec with universal2 support
          pyi-makespec --name MoodForager \
            --target-arch universal2 \
            --add-data="$(python -c 'import clip; print(clip.__path__[0])'):clip" \
            --add-data="$(python -c 'import torch; print(torch.__path__[0])'):torch" \
            --add-data="$(python -c 'import PIL; print(PIL.__path__[0])'):PIL" \
            --hidden-import=clip \
            --hidden-import=torch \
            --hidden-import=PIL \
            --windowed \
            --onedir \
            main_mf.py

          # Build with explicit universal2 flag
          pyinstaller MoodForager.spec \
            --noconfirm \
            --clean \
            --target-arch universal2

          # Verify binary architecture
          echo "Checking binary compatibility:"
          lipo -archs "dist/MoodForager.app/Contents/MacOS/MoodForager"
          if ! lipo -archs "dist/MoodForager.app/Contents/MacOS/MoodForager" | grep -q "x86_64"; then
            echo "ERROR: Missing Intel (x86_64) support"
            exit 1
          fi
          if ! lipo -archs "dist/MoodForager.app/Contents/MacOS/MoodForager" | grep -q "arm64"; then
            echo "ERROR: Missing Apple Silicon (arm64) support"
            exit 1
          fi

          # Fix Qt plugins for universal build
          mkdir -p dist/MoodForager.app/Contents/Resources/qt_plugins
          cp -R $QT_DIR/plugins/* dist/MoodForager.app/Contents/Resources/qt_plugins/
          
          # Create qt.conf with relative paths
          cat > dist/MoodForager.app/Contents/Resources/qt.conf <<EOF
          [Paths]
          Plugins = qt_plugins
          Prefix = $QT_DIR
          EOF

      - name: Verify Bundle Structure
        run: |
          # Check minimum OS version
          plutil -extract LSMinimumSystemVersion xml1 dist/MoodForager.app/Contents/Info.plist -o -
          
          # Verify all binaries are universal
          find dist/MoodForager.app -type f -exec file {} + | grep -v "universal binary with 2 architectures" | grep -v "Mach-O universal binary" && exit 1 || true

      - name: Package Universal Artifact
        run: |
          cd dist
          # Create ZIP with proper macOS metadata
          ditto -c -k --keepParent MoodForager.app MoodForager-Mac-Universal.zip
          
          # Verify ZIP contents
          unzip -l MoodForager-Mac-Universal.zip | grep "MoodForager.app/Contents/MacOS/MoodForager"

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac-Universal
          path: dist/MoodForager-Mac-Universal.zip
          retention-days: 7