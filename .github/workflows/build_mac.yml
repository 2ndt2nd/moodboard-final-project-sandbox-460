name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true  # Enable Git LFS for large files

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install system dependencies
        run: |
          brew install libpng jpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Generate setup.py
        run: |
          cat << EOF > setup.py
          import sys
          sys.setrecursionlimit(5000)  # Required for py2app modulegraph
          
          from setuptools import setup

          APP = ['qt_app.py']
          DATA_FILES = []
          OPTIONS = {
              'argv_emulation': False,
              'packages': ['PyQt5', 'torch', 'clip', 'tqdm', 'PIL'],
              'includes': [
                  'PyQt5.QtCore',
                  'PyQt5.QtGui', 
                  'PyQt5.QtWidgets',
                  'PyQt5.QtSvg'
              ],
              'excludes': ['tkinter'],
              'resources': [],
              'compressed': True,
              'iconfile': 'app_icon.icns',  # Add if you have an icon
              'plist': {
                  'CFBundleName': 'MoodForager',
                  'CFBundleShortVersionString': '1.0.0',
                  'CFBundleIdentifier': 'com.yourdomain.moodforager',
                  'NSRequiresAquaSystemAppearance': False,
              }
          }

          setup(
              app=APP,
              data_files=DATA_FILES,
              options={'py2app': OPTIONS},
              setup_requires=['py2app'],
          )
          EOF

      - name: Build with py2app
        run: |
          python setup.py py2app --no-strip
          # Fix Qt plugin paths if needed
          find dist -name "Qt*" -exec install_name_tool -add_rpath @executable_path/../Frameworks {} \;

      - name: Create DMG (optional)
        run: |
          hdiutil create -volname "MoodForager" \
          -srcfolder dist/MoodForager.app \
          -ov -format UDZO dist/MoodForager.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac
          path: |
            dist/MoodForager.app
            dist/MoodForager.dmg
          retention-days: 7
