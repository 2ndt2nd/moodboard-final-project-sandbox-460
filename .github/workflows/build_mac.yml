name: Build macOS App (Universal or Intel)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          rm -rf build dist __pycache__ *.spec
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete
          find . -name '*.pyo' -delete

      - name: Set up Python 3.10 (Intel)
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          architecture: "x64"  # Force Intel architecture (Universal includes this)

      - name: Install Qt (Intel-compatible)
        run: |
          brew install qt@5
          echo "QT_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@5)/bin" >> $GITHUB_PATH
          # Check Qt binaries
          file $(brew --prefix qt@5)/lib/*.dylib || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary --no-cache-dir PyQt5 PyQt5-sip
          pip install --pre --no-cache-dir \
            torch torchvision torchaudio \
            --extra-index-url https://download.pytorch.org/whl/nightly/cpu
          pip install --no-cache-dir git+https://github.com/openai/CLIP.git
          pip install tqdm pillow pyinstaller

      - name: Generate PyInstaller spec
        run: |
          pyi-makespec --name MoodForager \
            --add-data="$(python -c 'import clip; print(clip.__path__[0])'):clip" \
            --add-data="$(python -c 'import torch; print(torch.__path__[0])'):torch" \
            --add-data="$(python -c 'import PIL; print(PIL.__path__[0])'):PIL" \
            --hidden-import=clip \
            --hidden-import=torch \
            --hidden-import=PIL \
            --windowed \
            --onedir \
            main_mf.py

      - name: Build app with PyInstaller (Universal or Intel)
        run: |
          pyinstaller MoodForager.spec --noconfirm --clean

          echo "Checking binary architecture:"
          file dist/MoodForager.app/Contents/MacOS/MoodForager

      - name: Fix Qt plugins
        run: |
          mkdir -p dist/MoodForager.app/Contents/Resources/qt_plugins
          cp -R "$QT_DIR/plugins/"* dist/MoodForager.app/Contents/Resources/qt_plugins/

          cat > dist/MoodForager.app/Contents/Resources/qt.conf <<EOF
          [Paths]
          Plugins = qt_plugins
          Prefix = $QT_DIR
          EOF

      - name: Verify bundle
        run: |
          plutil -extract LSMinimumSystemVersion xml1 dist/MoodForager.app/Contents/Info.plist -o -
          find dist/MoodForager.app -type f -exec file {} + | grep -v "Mach-O universal binary" || true

      - name: Package .app into ZIP
        run: |
          cd dist
          ditto -c -k --keepParent MoodForager.app MoodForager-Mac.zip
          unzip -l MoodForager-Mac.zip | grep "MoodForager.app/Contents/MacOS/MoodForager"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac
          path: dist/MoodForager-Mac.zip
          retention-days: 7
