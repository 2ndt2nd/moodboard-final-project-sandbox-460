name: Build macOS App (PyInstaller) - Intel Compatible

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest  # Use current runner but force Intel compatibility

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          rm -rf build dist __pycache__ *.spec
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete
          find . -name '*.pyo' -delete

      - name: Set up Python 3.10 (Intel compatible)
        uses: actions/setup-python@v4
        with:
          python-version: "3.10.11"  # Specific version known to work
          architecture: "x64"  # Force x86_64 architecture

      - name: Install required system dependencies
        run: |
          brew install gettext
          brew link --force gettext

      - name: Install Qt (Intel compatible)
        run: |
          brew install qt@5
          echo "QT_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
          if [[ $(uname -m) == 'arm64' ]]; then
            # On Apple Silicon, use Rosetta for Intel compatibility
            echo "/usr/local/opt/qt@5/bin" >> $GITHUB_PATH
          else
            # On Intel, use normal path
            echo "/usr/local/opt/qt@5/bin" >> $GITHUB_PATH
          fi

      - name: Install dependencies (Intel compatible)
        run: |
          # Force Intel-compatible wheels
          export PIP_ONLY_BINARY=:all:
          export PIP_IGNORE_INSTALLED=0
          
          python -m pip install --upgrade pip
          pip install PyQt5==5.15.10 PyQt5-sip==12.13.0 --platform macosx_10_9_x86_64 --only-binary=:all:
          pip install --pre torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0 \
            --extra-index-url https://download.pytorch.org/whl/nightly/cpu \
            --platform macosx_10_9_x86_64
          pip install git+https://github.com/openai/CLIP.git
          pip install tqdm==4.66.1 pillow==10.1.0 pyinstaller==6.2.0

      - name: Build with PyInstaller (Intel compatible)
        run: |
          # Force x86_64 architecture
          export ARCHFLAGS="-arch x86_64"
          export PYTHONARCHS="x86_64"
          
          # Generate spec file
          pyi-makespec --name MoodForager \
            --add-data="$(python -c 'import clip; print(clip.__path__[0])'):clip" \
            --add-data="$(python -c 'import torch; print(torch.__path__[0])'):torch" \
            --add-data="$(python -c 'import PIL; print(PIL.__path__[0])'):PIL" \
            --hidden-import=clip \
            --hidden-import=torch \
            --hidden-import=PIL \
            --windowed \
            --onedir \
            main_mf.py
          
          # Build with explicit arch flags
          pyinstaller MoodForager.spec --noconfirm --clean
          
          # Handle Qt plugins
          mkdir -p dist/MoodForager.app/Contents/Resources/qt_plugins
          cp -R $QT_DIR/plugins/* dist/MoodForager.app/Contents/Resources/qt_plugins/
          
          cat > dist/MoodForager.app/Contents/Resources/qt.conf <<EOF
          [Paths]
          Plugins = qt_plugins
          EOF

      - name: Verify Intel compatibility
        run: |
          # Check binary architecture
          file dist/MoodForager.app/Contents/MacOS/MoodForager | grep "x86_64"
          if [ $? -ne 0 ]; then
            echo "Error: Binary not built for Intel architecture"
            exit 1
          fi

      - name: Package artifact
        run: |
          cd dist
          zip -r MoodForager-Mac-Intel.zip MoodForager.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac-Intel
          path: dist/MoodForager-Mac-Intel.zip
          retention-days: 7