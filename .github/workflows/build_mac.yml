name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          brew install libpng jpeg
          # Required for PyQt5
          brew install qt@5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          # Install PyQt5 from pre-built wheels
          pip install PyQt5==5.15.7 PyQt5-Qt5==5.15.2 PyQt5-sip==12.11.0
          # Install other dependencies
          pip install --pre torch==2.1.0 --extra-index-url https://download.pytorch.org/whl/nightly/cpu
          pip install git+https://github.com/openai/CLIP.git
          pip install tqdm==4.66.1 pillow==10.0.1 py2app==0.28.6

      - name: Create optimized setup.py
        run: |
          cat << 'EOF' > setup.py
          import sys
          sys.setrecursionlimit(5000)
          
          from setuptools import setup

          # Force include Qt components
          import PyQt5.QtCore
          import PyQt5.QtGui
          import PyQt5.QtWidgets
          import PyQt5.QtSvg

          APP = ['qt_app.py']
          DATA_FILES = []
          OPTIONS = {
              'argv_emulation': False,
              'packages': ['PyQt5', 'torch', 'clip', 'tqdm', 'PIL'],
              'includes': [
                  'numpy',
                  'PIL.Image',
                  'PIL.ImageDraw',
                  'PIL.ImageFont'
              ],
              'excludes': [
                  'tkinter',
                  'matplotlib',
                  'scipy'
              ],
              'resources': [],
              'compressed': True,
              'optimize': 2,
              'plist': {
                  'CFBundleName': 'MoodForager',
                  'CFBundleShortVersionString': '1.0.0',
                  'CFBundleIdentifier': 'com.yourdomain.moodforager',
                  'NSRequiresAquaSystemAppearance': False,
                  'LSMinimumSystemVersion': '10.15'
              }
          }

          setup(
              app=APP,
              data_files=DATA_FILES,
              options={'py2app': OPTIONS},
              setup_requires=['py2app'],
          )
          EOF

      - name: Build application
        run: |
          # Clean previous builds
          rm -rf build dist
          
          # Build with py2app
          python setup.py py2app --no-strip
          
          # Fix Qt paths
          find dist/MoodForager.app/Contents -name "Qt*" -exec install_name_tool -add_rpath @executable_path/../Frameworks {} \;

      - name: Verify bundle
        run: |
          ls -la dist/MoodForager.app/Contents/MacOS/
          ls -la dist/MoodForager.app/Contents/Frameworks/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac-Bundle
          path: dist/MoodForager.app
          retention-days: 7
