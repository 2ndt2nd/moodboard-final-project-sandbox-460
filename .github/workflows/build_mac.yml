name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          echo "Cleaning workspace and Python artifacts..."
          rm -rf build dist __pycache__ *.egg-info
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete
          find . -name '*.pyo' -delete
          find . -name '*.egg-info' -exec rm -rf {} +

      - name: Clean py2app temp directories
        run: |
          echo "Cleaning py2app temp folders..."
          rm -rf /tmp/tmp.*
          rm -rf /var/folders/*/*/*/T/tmp.*

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Qt
        run: |
          echo "Installing Qt..."
          brew install qt@5
          echo "QT_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "/opt/homebrew/opt/qt@5/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          echo "Installing Python packages..."
          python -m pip install --upgrade pip
          pip install wheel==0.45.1 setuptools==68.2.2

          pip install PyQt5==5.15.11 PyQt5-sip==12.15.0 --prefer-binary

          pip install --pre torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0 \
            --extra-index-url https://download.pytorch.org/whl/nightly/cpu

          pip install git+https://github.com/openai/CLIP.git
          pip install tqdm==4.66.1 pillow==10.0.1 py2app==0.28.6

      - name: Build application
        run: |
          echo "Starting py2app build..."
          export BUILD_DIR=$(mktemp -d)
          echo "Using temporary build directory: $BUILD_DIR"

          python setup.py py2app \
            --no-strip \
            --no-chdir \
            --bdist-base=$BUILD_DIR \
            --dist-dir=$BUILD_DIR/dist

          echo "Fixing Qt rpaths..."
          find $BUILD_DIR/dist -name "Qt*" -exec install_name_tool -add_rpath @executable_path/../Frameworks {} \;

          echo "Moving app to final dist directory..."
          mkdir -p dist
          cp -R $BUILD_DIR/dist/MoodForager.app dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac
          path: dist/MoodForager.app
          retention-days: 7
