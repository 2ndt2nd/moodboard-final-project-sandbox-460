name: Build macOS App

on: [push]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      # 1. Checkout code (updated to v3)
      - uses: actions/checkout@v3

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # 3. Install dependencies
      - name: Install packages
        run: |
          pip install py2app PyQt5 torch clip tqdm

      # 4. Build the app
      - name: Run py2app
        run: |
          python setup.py py2app

      # 5. Upload artifact (updated to v3)
      - name: Upload MoodForager.app
        uses: actions/upload-artifact@v3
        with:
          name: MoodForager-Mac
          path: dist/MoodForager.app