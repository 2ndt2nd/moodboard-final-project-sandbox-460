name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          rm -rf build dist
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete

      - name: Clean py2app temp directories
        run: |
          # Remove py2app temp folders to avoid file exists error
          rm -rf /tmp/tmp.*

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Qt
        run: |
          brew install qt@5
          echo "QT_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "/opt/homebrew/opt/qt@5/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          
          # Install compatible PyQt5 versions
          pip install PyQt5==5.15.11 PyQt5-sip==12.15.0 --prefer-binary
          
          # Install core requirements
          pip install --pre torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0 \
            --extra-index-url https://download.pytorch.org/whl/nightly/cpu
          pip install git+https://github.com/openai/CLIP.git
          pip install tqdm==4.66.1 pillow==10.0.1 py2app==0.28.6

      - name: Build application
        run: |
          # Create isolated build directory
          export BUILD_DIR=$(mktemp -d)
          echo "Building in: $BUILD_DIR"
          
          python setup.py py2app \
            --no-strip \
            --bdist-base=$BUILD_DIR \
            --dist-dir=$BUILD_DIR/dist
          
          # Fix Qt paths
          find $BUILD_DIR/dist -name "Qt*" -exec install_name_tool -add_rpath @executable_path/../Frameworks {} \;
          
          # Copy to final location
          mkdir -p dist
          cp -R $BUILD_DIR/dist/MoodForager.app dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac
          path: dist/MoodForager.app
          retention-days: 7
