name: Build macOS App (Intel-only)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          rm -rf build dist __pycache__ *.spec
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete
          find . -name '*.pyo' -delete

      - name: Set up Python 3.10 (Intel)
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Install Intel Qt
        run: |
          brew install qt@5
          echo "QT_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@5)/bin" >> $GITHUB_PATH
          echo "DYLD_LIBRARY_PATH=$(brew --prefix gettext)/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install dependencies (Intel)
        run: |
          python -m pip install --upgrade pip
          
          # Install PyQt5 for Intel architecture
          pip install PyQt5==5.15.10 PyQt5-sip==12.13.0 \
            --only-binary=:all: \
            --platform macosx_10_9_x86_64 \
            --implementation cp \
            --abi cp310 \
            --no-deps

          # Install torch CPU nightly (Intel)
          pip install --pre torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0 \
            --extra-index-url https://download.pytorch.org/whl/nightly/cpu \
            --platform macosx_10_9_x86_64 \
            --implementation cp \
            --abi cp310

          pip install git+https://github.com/openai/CLIP.git
          pip install tqdm pillow pyinstaller==6.2.0

      - name: Build Intel App
        run: |
          export ARCHFLAGS="-arch x86_64"
          export PYTHONARCHS="x86_64"

          # Generate spec file
          pyi-makespec --name MoodForager \
            --add-data="$(python -c 'import clip; print(clip.__path__[0])'):clip" \
            --add-data="$(python -c 'import torch; print(torch.__path__[0])'):torch" \
            --add-data="$(python -c 'import PIL; print(PIL.__path__[0])'):PIL" \
            --hidden-import=clip \
            --hidden-import=torch \
            --hidden-import=PIL \
            --windowed \
            --onedir \
            main_mf.py

          # Build for Intel architecture
          pyinstaller MoodForager.spec --noconfirm --clean

          # Qt plugin setup
          mkdir -p dist/MoodForager.app/Contents/Resources/qt_plugins
          cp -R $QT_DIR/plugins/* dist/MoodForager.app/Contents/Resources/qt_plugins/
          
          cat > dist/MoodForager.app/Contents/Resources/qt.conf <<EOF
          [Paths]
          Plugins = qt_plugins
          EOF

      - name: Verify Intel Architecture
        run: |
          echo "Binary architecture:"
          file dist/MoodForager.app/Contents/MacOS/MoodForager
          
          if ! file dist/MoodForager.app/Contents/MacOS/MoodForager | grep -q "x86_64"; then
            echo "::error::Binary not built for Intel architecture"
            exit 1
          fi

      - name: Package Artifact
        run: |
          cd dist
          ditto -c -k --keepParent MoodForager.app MoodForager-Mac-Intel.zip
          unzip -l MoodForager-Mac-Intel.zip | grep "MoodForager.app/Contents/MacOS/MoodForager"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac-Intel
          path: dist/MoodForager-Mac-Intel.zip
          retention-days: 7
