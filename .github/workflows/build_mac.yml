name: Universal macOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          rm -rf build dist __pycache__ *.spec
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete
          find . -name '*.pyo' -delete

      - name: Install Python via Miniforge (bypass gettext issue)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Mambaforge
          miniforge-version: latest
          python-version: "3.10"
          activate-environment: "build"
          environment-file: environment.yml

      - name: Create conda environment file
        run: |
          cat > environment.yml <<EOF
          name: build
          channels:
            - conda-forge
            - defaults
          dependencies:
            - python=3.10
            - pip
            - gettext
            - qt
            - pyqt
            - pip:
              - torch==2.0.1
              - torchvision==0.15.2
              - torchaudio==2.0.2
              - git+https://github.com/openai/CLIP.git
              - tqdm==4.65.0
              - pillow==9.5.0
              - pyinstaller==5.13.0
          EOF

      - name: Install dependencies via conda
        shell: bash -l {0}
        run: |
          conda env update -f environment.yml
          conda list

      - name: Build universal app
        shell: bash -l {0}
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.15
          export ARCHFLAGS="-arch x86_64 -arch arm64"
          
          pyi-makespec --name MoodForager \
            --add-data="$(python -c 'import clip; print(clip.__path__[0])'):clip" \
            --add-data="$(python -c 'import torch; print(torch.__path__[0])'):torch" \
            --add-data="$(python -c 'import PIL; print(PIL.__path__[0])'):PIL" \
            --hidden-import=clip \
            --hidden-import=torch \
            --hidden-import=PIL \
            --windowed \
            --onedir \
            main_mf.py

          pyinstaller MoodForager.spec --noconfirm --clean

          mkdir -p dist/MoodForager.app/Contents/Resources/qt_plugins
          cp -R $CONDA_PREFIX/plugins/* dist/MoodForager.app/Contents/Resources/qt_plugins/

          cat > dist/MoodForager.app/Contents/Resources/qt.conf <<EOF
          [Paths]
          Plugins = qt_plugins
          EOF

      - name: Verify universal binary
        run: |
          lipo -archs dist/MoodForager.app/Contents/MacOS/MoodForager
          otool -l dist/MoodForager.app/Contents/MacOS/MoodForager | grep -A3 LC_VERSION_MIN_MACOSX

      - name: Package and upload
        run: |
          cd dist
          ditto -c -k --keepParent MoodForager.app MoodForager-Mac-Universal.zip
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac-Universal
          path: dist/MoodForager-Mac-Universal.zip
          retention-days: 7