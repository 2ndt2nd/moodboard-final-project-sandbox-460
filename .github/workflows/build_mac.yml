name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'
          
      - name: Clean previous builds
        run: |
          rm -rf build dist *.egg-info __pycache__

      - name: Install Qt and dependencies
        run: |
          # Install Homebrew if not already installed
          if ! command -v brew &> /dev/null; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo 'export PATH="/usr/local/bin:$PATH"' >> ~/.bash_profile
            source ~/.bash_profile
          fi

          # Install Qt5
          brew install qt@5

          # Add Qt binaries to path
          echo "QT_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@5)/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools

          # Install PyQt5 using latest prebuilt wheel
          pip install --only-binary=:all: PyQt5==5.15.11

          # Core dependencies
          pip install --pre torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0 \
            --extra-index-url https://download.pytorch.org/whl/nightly/cpu
          pip install git+https://github.com/openai/CLIP.git
          pip install tqdm==4.66.1 pillow==10.0.1 py2app==0.28.6

      - name: Build application
        run: |
          # Clean up previous build outputs
          rm -rf build dist

          # Check if qmake is correctly linked
          which qmake
          qmake --version

          # Build app using py2app
          python setup.py py2app --no-strip

          # Fix Qt paths so the app bundles correctly
          find dist/MoodForager.app/Contents -name "Qt*" -exec install_name_tool -add_rpath @executable_path/../Frameworks {} \;

      - name: Upload built app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac-Bundle
          path: dist/MoodForager.app
          retention-days: 7
