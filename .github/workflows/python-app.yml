name: Build macOS App (PyInstaller onedir) - Intel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-12  # Explicitly use Intel-based runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Clean workspace
        run: |
          rm -rf build dist __pycache__ *.spec
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*.pyc' -delete
          find . -name '*.pyo' -delete

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Qt
        run: |
          brew install qt@5
          echo "QT_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "/usr/local/opt/qt@5/bin" >> $GITHUB_PATH  # Intel Homebrew path

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Force x86_64 wheels
          pip install PyQt5 PyQt5-sip --prefer-binary --only-binary=:all:
          # Explicit x86_64 torch
          pip install --pre torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0 \
            --extra-index-url https://download.pytorch.org/whl/nightly/cpu \
            --platform macosx_10_9_x86_64  # Force Intel architecture
          pip install git+https://github.com/openai/CLIP.git
          pip install tqdm pillow pyinstaller

      - name: Build with PyInstaller (onedir)
        run: |
          # Force x86_64 architecture
          export ARCHFLAGS="-arch x86_64"
          
          # Generate spec file with proper data collection
          pyi-makespec --name MoodForager \
            --add-data="$(python -c 'import clip; print(clip.__path__[0])'):clip" \
            --add-data="$(python -c 'import torch; print(torch.__path__[0])'):torch" \
            --add-data="$(python -c 'import PIL; print(PIL.__path__[0])'):PIL" \
            --hidden-import=clip \
            --hidden-import=torch \
            --hidden-import=PIL \
            --windowed \
            --onedir \
            main_mf.py
          
          # Build the application with explicit arch
          pyinstaller MoodForager.spec --noconfirm --clean
          
          # Fix Qt plugins path
          mkdir -p dist/MoodForager.app/Contents/Resources/qt_plugins
          cp -R $QT_DIR/plugins/* dist/MoodForager.app/Contents/Resources/qt_plugins/
          
          # Set Qt plugin environment
          cat > dist/MoodForager.app/Contents/Resources/qt.conf <<EOF
          [Paths]
          Plugins = qt_plugins
          EOF

      - name: Verify architecture
        run: |
          # Check the built binary is x86_64
          file dist/MoodForager.app/Contents/MacOS/MoodForager | grep "x86_64"
          if [ $? -ne 0 ]; then
            echo "Error: Binary not built for x86_64 architecture"
            exit 1
          fi

      - name: Package artifact
        run: |
          cd dist
          zip -r MoodForager-Mac-Intel.zip MoodForager.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodForager-Mac-Intel
          path: dist/MoodForager-Mac-Intel.zip
          retention-days: 7
